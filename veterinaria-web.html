<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veterinaria - Administrador</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1d2733;--mut:#667085;--pri:#0f766e;--bd:#d9dee5;--err:#b42318;--ok:#067647}
@media (prefers-color-scheme:dark){:root{--bg:#10161c;--card:#19212a;--tx:#e8edf2;--mut:#98a2b3;--pri:#2dd4bf;--bd:#2b3743;--err:#f97066;--ok:#47cd89}}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}
main{max-width:1000px;margin:20px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input,select,textarea,button{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{cursor:pointer;background:var(--pri);color:#fff;border:none}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.del{background:var(--err)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.full{grid-column:1/-1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-size:12px;text-transform:uppercase}
td button{padding:5px 9px;font-size:12px;margin-right:4px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
#toast{position:fixed;bottom:18px;right:18px;padding:10px 16px;border-radius:8px;color:#fff;display:none;z-index:9}
.hide{display:none}
#login{max-width:340px;margin:80px auto}
#login form{grid-template-columns:1fr}
.badge{font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid var(--bd);color:var(--mut)}
</style>
</head>
<body>
<div id="login" class="card hide">
  <h1>Veterinaria · Administrador</h1><p style="color:var(--mut)">Inicia sesión para continuar</p>
  <form onsubmit="return login(event)">
    <div><label>Correo</label><input id="lemail" type="email" required style="width:100%"></div>
    <div><label>Contraseña</label><input id="lpass" type="password" required style="width:100%"></div>
    <button>Ingresar</button>
  </form>
</div>

<div id="app" class="hide">
<header><h1>🐾 Veterinaria · Panel del Administrador</h1><div><span id="who" style="color:var(--mut);font-size:13px;margin-right:10px"></span><button class="sec" onclick="logout()">Salir</button></div></header>
<main>
  <div class="tabs">
    <button id="t-duenos" onclick="tab('duenos')">Dueños</button>
    <button id="t-mascotas" onclick="tab('mascotas')">Mascotas</button>
    <button id="t-historial" onclick="tab('historial')">Historial clínico</button>
  </div>
  <div class="bar"><span class="badge" id="origen"></span><label style="margin:0"><input type="checkbox" id="inact" onchange="refresh()"> Ver inactivos (eliminados lógicamente)</label></div>

  <section id="s-duenos" class="hide">
    <div class="card"><form onsubmit="return saveDueno(event)">
      <input type="hidden" id="d-id">
      <div><label>Nombre *</label><input id="d-nombre" required></div>
      <div><label>Teléfono</label><input id="d-tel"></div>
      <div><label>Dirección</label><input id="d-dir"></div>
      <div><button>Guardar</button> <button type="button" class="sec" onclick="resetD()">Limpiar</button></div>
    </form></div>
    <div class="card tw"><table><thead><tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Dirección</th><th></th></tr></thead><tbody id="b-duenos"></tbody></table></div>
  </section>

  <section id="s-mascotas" class="hide">
    <div class="card"><form onsubmit="return saveMascota(event)">
      <input type="hidden" id="m-id">
      <div><label>Nombre *</label><input id="m-nombre" required></div>
      <div><label>Especie *</label><input id="m-esp" required></div>
      <div><label>Raza</label><input id="m-raza"></div>
      <div><label>Edad</label><input id="m-edad" type="number" min="0"></div>
      <div><label>Dueño *</label><select id="m-dueno" required></select></div>
      <div><button>Guardar</button> <button type="button" class="sec" onclick="resetM()">Limpiar</button></div>
    </form></div>
    <div class="card tw"><table><thead><tr><th>ID</th><th>Nombre</th><th>Especie</th><th>Raza</th><th>Edad</th><th>Dueño</th><th></th></tr></thead><tbody id="b-mascotas"></tbody></table></div>
  </section>

  <section id="s-historial" class="hide">
    <div class="card"><label>Mascota</label><select id="h-masc" onchange="loadHistorial()" style="min-width:260px"></select></div>
    <div class="card"><form onsubmit="return saveHist(event)">
      <input type="hidden" id="h-id">
      <div><label>Fecha</label><input id="h-fecha" type="date"></div>
      <div><label>Diagnóstico *</label><input id="h-diag" required></div>
      <div><label>Tratamiento (separado por comas)</label><input id="h-trat" placeholder="gotas, limpieza"></div>
      <div><label>Vacunas (nombre:dosis, ...)</label><input id="h-vac" placeholder="Rabia:1, Parvovirus:2"></div>
      <div class="full"><label>Notas</label><textarea id="h-notas" rows="2" style="width:100%"></textarea></div>
      <div><button>Guardar</button> <button type="button" class="sec" onclick="resetH()">Limpiar</button></div>
    </form></div>
    <div class="card tw"><table><thead><tr><th>Fecha</th><th>Diagnóstico</th><th>Tratamiento</th><th>Vacunas</th><th>Notas</th><th></th></tr></thead><tbody id="b-historial"></tbody></table></div>
  </section>
</main>
</div>
<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://jnzdecsecrdyowjppdgq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OVuEsAlfwur1z1DNrF9yug_r-EQfPIS';
const API_URL = 'http://localhost:3000';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const verInact = () => $('inact').checked;
let current = 'duenos', histCache = {};

function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.style.background = err ? 'var(--err)' : 'var(--ok)';
  t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000);
}

/* ---------- Autenticación (Supabase Auth) ---------- */
async function login(e) {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $('lemail').value, password: $('lpass').value });
  if (error) return toast('Credenciales incorrectas', true), false;
  start(); return false;
}
async function logout() { await sb.auth.signOut(); location.reload(); }
async function start() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { $('login').classList.remove('hide'); $('app').classList.add('hide'); return; }
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('who').textContent = data.session.user.email;
  tab('duenos');
}

/* ---------- Navegación ---------- */
function tab(n) {
  current = n;
  ['duenos', 'mascotas', 'historial'].forEach((x) => {
    $('s-' + x).classList.toggle('hide', x !== n);
    $('t-' + x).classList.toggle('on', x === n);
  });
  $('origen').textContent = n === 'historial' ? 'Origen: MongoDB Atlas (no relacional) vía API' : 'Origen: Supabase PostgreSQL (relacional)';
  refresh();
}
function refresh() {
  if (current === 'duenos') loadDuenos();
  else if (current === 'mascotas') loadMascotas();
  else loadMascSelect();
}

/* ---------- DUEÑOS (Supabase) ---------- */
function resetD() { $('d-id').value = $('d-nombre').value = $('d-tel').value = $('d-dir').value = ''; }
async function loadDuenos() {
  const { data, error } = await sb.from('duenos').select('*').eq('estado', !verInact()).order('id');
  if (error) return toast(error.message, true);
  $('b-duenos').innerHTML = data.map((d) => `<tr><td>${d.id}</td><td>${esc(d.nombre)}</td><td>${esc(d.telefono)}</td><td>${esc(d.direccion)}</td><td>` +
    (d.estado ? `<button class="sec" onclick="editD(${d.id})">Editar</button><button class="del" onclick="setEstadoD(${d.id},false)">Eliminar</button>`
              : `<button onclick="setEstadoD(${d.id},true)">Restaurar</button>`) + `</td></tr>`).join('') || '<tr><td colspan="5">Sin registros</td></tr>';
}
async function saveDueno(e) {
  e.preventDefault();
  const row = { nombre: $('d-nombre').value.trim(), telefono: $('d-tel').value.trim(), direccion: $('d-dir').value.trim() };
  const id = $('d-id').value;
  const { error } = id ? await sb.from('duenos').update(row).eq('id', id) : await sb.from('duenos').insert({ ...row, estado: true });
  if (error) return toast(error.message, true), false;
  toast(id ? 'Dueño actualizado' : 'Dueño creado'); resetD(); loadDuenos(); return false;
}
async function editD(id) {
  const { data } = await sb.from('duenos').select('*').eq('id', id).single();
  $('d-id').value = data.id; $('d-nombre').value = data.nombre; $('d-tel').value = data.telefono || ''; $('d-dir').value = data.direccion || '';
  window.scrollTo(0, 0);
}
async function setEstadoD(id, estado) {
  if (!estado) {
    const { count } = await sb.from('mascotas').select('id', { count: 'exact', head: true }).eq('dueno_id', id).eq('estado', true);
    if (count > 0) return toast('No se puede: el dueño tiene mascotas activas', true);
    if (!confirm('¿Desactivar este dueño?')) return;
  }
  const { error } = await sb.from('duenos').update({ estado }).eq('id', id);
  if (error) return toast(error.message, true);
  toast(estado ? 'Dueño restaurado' : 'Dueño desactivado'); loadDuenos();
}

/* ---------- MASCOTAS (Supabase) ---------- */
function resetM() { ['m-id', 'm-nombre', 'm-esp', 'm-raza', 'm-edad'].forEach((i) => $(i).value = ''); }
async function fillDuenos() {
  const { data } = await sb.from('duenos').select('id,nombre').eq('estado', true).order('nombre');
  $('m-dueno').innerHTML = '<option value="">-- Seleccione --</option>' + (data || []).map((d) => `<option value="${d.id}">${esc(d.nombre)}</option>`).join('');
}
async function loadMascotas() {
  await fillDuenos();
  const { data, error } = await sb.from('mascotas').select('*, duenos(nombre)').eq('estado', !verInact()).order('id');
  if (error) return toast(error.message, true);
  $('b-mascotas').innerHTML = data.map((m) => `<tr><td>${m.id}</td><td>${esc(m.nombre)}</td><td>${esc(m.especie)}</td><td>${esc(m.raza)}</td><td>${esc(m.edad)}</td><td>${esc(m.duenos?.nombre)}</td><td>` +
    (m.estado ? `<button class="sec" onclick="editM(${m.id})">Editar</button><button class="del" onclick="setEstadoM(${m.id},false)">Eliminar</button>`
              : `<button onclick="setEstadoM(${m.id},true)">Restaurar</button>`) + `</td></tr>`).join('') || '<tr><td colspan="7">Sin registros</td></tr>';
}
async function saveMascota(e) {
  e.preventDefault();
  const row = { nombre: $('m-nombre').value.trim(), especie: $('m-esp').value.trim(), raza: $('m-raza').value.trim(),
    edad: $('m-edad').value === '' ? null : Number($('m-edad').value), dueno_id: Number($('m-dueno').value) };
  const id = $('m-id').value;
  const { error } = id ? await sb.from('mascotas').update(row).eq('id', id) : await sb.from('mascotas').insert({ ...row, estado: true });
  if (error) return toast(error.message, true), false;
  toast(id ? 'Mascota actualizada' : 'Mascota creada'); resetM(); loadMascotas(); return false;
}
async function editM(id) {
  const { data } = await sb.from('mascotas').select('*').eq('id', id).single();
  $('m-id').value = data.id; $('m-nombre').value = data.nombre; $('m-esp').value = data.especie; $('m-raza').value = data.raza || '';
  $('m-edad').value = data.edad ?? ''; $('m-dueno').value = data.dueno_id; window.scrollTo(0, 0);
}
async function setEstadoM(id, estado) {
  if (!estado && !confirm('¿Desactivar esta mascota?')) return;
  const { error } = await sb.from('mascotas').update({ estado }).eq('id', id);
  if (error) return toast(error.message, true);
  toast(estado ? 'Mascota restaurada' : 'Mascota desactivada'); loadMascotas();
}

/* ---------- HISTORIAL (API -> MongoDB Atlas) ---------- */
async function api(path, method = 'GET', body) {
  const r = await fetch(API_URL + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error en la API');
  return j;
}
async function loadMascSelect() {
  const { data } = await sb.from('mascotas').select('id,nombre,especie').eq('estado', true).order('nombre');
  const prev = $('h-masc').value;
  $('h-masc').innerHTML = (data || []).map((m) => `<option value="${m.id}">${esc(m.nombre)} (${esc(m.especie)}) · #${m.id}</option>`).join('');
  if (prev) $('h-masc').value = prev;
  loadHistorial();
}
function resetH() { ['h-id', 'h-fecha', 'h-diag', 'h-trat', 'h-vac', 'h-notas'].forEach((i) => $(i).value = ''); }
async function loadHistorial() {
  const mid = $('h-masc').value;
  if (!mid) { $('b-historial').innerHTML = '<tr><td colspan="6">No hay mascotas activas</td></tr>'; return; }
  try {
    const docs = await api(`/historial/mascota/${mid}?estado=${!verInact()}`);
    histCache = {}; docs.forEach((d) => histCache[d._id] = d);
    $('b-historial').innerHTML = docs.map((d) => `<tr><td>${esc((d.fecha || '').slice(0, 10))}</td><td>${esc(d.diagnostico)}</td><td>${esc((d.tratamiento || []).join(', '))}</td>` +
      `<td>${esc((d.vacunas || []).map((v) => `${v.nombre} (dosis ${v.dosis})`).join(', '))}</td><td>${esc(d.notas)}</td><td>` +
      (d.estado ? `<button class="sec" onclick="editH('${d._id}')">Editar</button><button class="del" onclick="delH('${d._id}')">Eliminar</button>`
                : `<button onclick="restH('${d._id}')">Restaurar</button>`) + `</td></tr>`).join('') || '<tr><td colspan="6">Sin registros</td></tr>';
  } catch (e) { toast('API no disponible: ' + e.message, true); }
}
async function saveHist(e) {
  e.preventDefault();
  const mid = Number($('h-masc').value);
  if (!mid) return toast('Seleccione una mascota', true), false;
  const vac = $('h-vac').value.split(',').map((s) => s.trim()).filter(Boolean).map((s) => { const [n, d] = s.split(':'); return { nombre: n.trim(), dosis: Number(d) || 1 }; });
  const body = { mascota_id: mid, diagnostico: $('h-diag').value.trim(), tratamiento: $('h-trat').value.split(',').map((s) => s.trim()).filter(Boolean), vacunas: vac, notas: $('h-notas').value.trim() };
  if ($('h-fecha').value) body.fecha = $('h-fecha').value;
  const id = $('h-id').value;
  try {
    if (id) await api('/historial/' + id, 'PUT', body); else await api('/historial', 'POST', body);
    toast(id ? 'Registro actualizado' : 'Registro creado'); resetH(); loadHistorial();
  } catch (err) { toast(err.message, true); }
  return false;
}
function editH(id) {
  const d = histCache[id];
  $('h-id').value = d._id; $('h-fecha').value = (d.fecha || '').slice(0, 10); $('h-diag').value = d.diagnostico;
  $('h-trat').value = (d.tratamiento || []).join(', '); $('h-vac').value = (d.vacunas || []).map((v) => `${v.nombre}:${v.dosis}`).join(', '); $('h-notas').value = d.notas || '';
  window.scrollTo(0, 0);
}
async function delH(id) {
  if (!confirm('¿Desactivar este registro?')) return;
  try { await api('/historial/' + id, 'DELETE'); toast('Registro desactivado'); loadHistorial(); } catch (e) { toast(e.message, true); }
}
async function restH(id) {
  try { await api(`/historial/${id}/restaurar`, 'PATCH'); toast('Registro restaurado'); loadHistorial(); } catch (e) { toast(e.message, true); }
}

start();
</script>
</body>
</html>
